<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Previewer — Live Rendered Preview | Toolcrate</title>
<meta name="description" content="Write Markdown and see it rendered live as formatted HTML side by side. Runs entirely in your browser, no signup.">
<script>
  (function(){var t=localStorage.getItem('toolcrate-theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);})();
</script>
<link rel="stylesheet" href="../style.css">
<style>
  .preview-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 1.35rem 1.55rem;
    font-size: 0.92rem;
    line-height: 1.6;
    overflow-x: auto;
  }
  .preview-panel h1, .preview-panel h2, .preview-panel h3 { margin-top: 1em; }
  .preview-panel h1:first-child, .preview-panel h2:first-child, .preview-panel h3:first-child { margin-top: 0; }
  .preview-panel p { max-width: none; color: var(--ink); }
  .preview-panel a { color: var(--accent); }
  .preview-panel code {
    background: var(--line-soft);
    color: var(--ink);
    padding: 0.12em 0.4em;
    border-radius: 4px;
    font-size: 0.88em;
  }
  .preview-panel pre {
    background: var(--line-soft);
    padding: 0.9rem 1rem;
    border-radius: 6px;
    overflow-x: auto;
  }
  .preview-panel pre code { background: none; padding: 0; }
  .preview-panel blockquote {
    border-left: 3px solid var(--line);
    margin: 0.8em 0;
    padding: 0.1em 0 0.1em 1rem;
    color: var(--ink-soft);
  }
  .preview-panel ul, .preview-panel ol { padding-left: 1.4rem; }
  .preview-panel img { max-width: 100%; border-radius: 6px; }
  .preview-panel hr { border: none; border-top: 1px solid var(--line); margin: 1.5em 0; }
  .preview-panel table { border-collapse: collapse; width: 100%; margin: 0.8em 0; font-size: 0.88em; }
  .preview-panel th, .preview-panel td { border: 1px solid var(--line); padding: 0.4rem 0.6rem; text-align: left; }
  .preview-panel th { background: var(--line-soft); }
  .preview-empty { color: var(--muted); }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <a href="/" class="brand">tool<em>crate</em></a>
    <div class="header-right"><nav class="site-nav"><a href="/">All tools</a></nav><button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">☾</button></div>
  </div>
</header>

<main>
  <div class="tool-header">
    <h1>Markdown Previewer</h1>
    <p>Write Markdown on the left and see it rendered live on the right.</p>
  </div>

  <div class="panel">
    <div class="row">
      <div class="field">
        <label for="input">Markdown</label>
        <textarea id="input" rows="14" spellcheck="false"># Heading

Some **bold** and *italic* text, plus `inline code`.

- List item one
- List item two
  - Nested item

1. First
2. Second

> A blockquote for emphasis.

[A link](https://example.com)
